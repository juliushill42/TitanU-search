version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: titan_search
      POSTGRES_USER: titan
      POSTGRES_PASSWORD: ${PG_PASSWORD:-titanpass}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U titan -d titan_search"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: "8080"
      PG_DSN: postgres://titan:${PG_PASSWORD:-titanpass}@postgres:5432/titan_search
      REDIS_URL: redis://redis:6379
      OPENAI_KEY: ${OPENAI_KEY:-}
      GIN_MODE: release
    ports:
      - "8080:8080"

  web:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://api:8080/api/v1
    ports:
      - "3000:3000"

volumes:
  pg_data:
